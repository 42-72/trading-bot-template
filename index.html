            html.mw-boot #modal_root,

                opacity: 0 !important;
                pointer-events: none !important;

            #mw-boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483646;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.6rem;
                background: #0e0e0e;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            }

            #mw-boot-splash .wm {
                font-size: 3.2rem;
                font-weight: 900;
                letter-spacing: -1px;
                line-height: 1;
                white-space: nowrap;
            }
            #mw-boot-splash .wm-charles {
                color: #22c55e;
                text-shadow: 0 0 20px #22c55e80;
            }
            #mw-boot-splash .wm-traders {
                color: #ef4444;
                text-shadow: 0 0 20px #ef444480;
            }

            #mw-boot-splash .tag {
                font-size: 1.2rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #94a3b8;
            }

            #mw-boot-splash .bar {
                width: 16rem;
                height: 3px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.08);
                overflow: hidden;
            }
            #mw-boot-splash .bar::after {
                content: '';
                display: block;
                width: 40%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #22c55e, #22d3ee);
                animation: mw-boot-progress 1.2s ease-in-out infinite;
            }

            @keyframes mw-boot-progress {
                0% {
                    transform: translateX(-120%);
                }
                100% {
                    transform: translateX(320%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #mw-boot-splash .bar::after {
                    animation: none;
                    width: 100%;
                }
            }
        </style>

            document.documentElement.classList.add('mw-boot');

            }, 8000);
