<!doctype html>
<html lang="en" dir="auto" class="dark">
    <head>
        <!-- Applies the persisted theme (ct-theme) to <html> before first paint, so a
             light-mode visitor doesn't see a dark flash on reload. Dark stays the default:
             this only ever REMOVES the dark class, it never adds theme--light itself (that
             needs <body>, which doesn't exist yet here - see the matching script at the top
             of <body>). If localStorage is unavailable, the static dark classes authored
             below stand as-is. -->
        <script>
            (function () {
                try {
                    if (localStorage.getItem('ct-theme') === 'light') {
                        document.documentElement.classList.remove('dark');
                    }
                } catch (e) {
                    /* localStorage unavailable - keep the authored dark default */
                }
            })();
        </script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/charlestraders-logo.svg" />
        <!-- DTrader tab (embedded dtrader.charlestraders.com) and the Deriv API it and
             this app connect to: resolve / connect early so the first open starts sooner. -->
        <link rel="preconnect" href="https://dtrader.charlestraders.com" />
        <link rel="dns-prefetch" href="https://dtrader.charlestraders.com" />
        <link rel="dns-prefetch" href="https://api.derivws.com" />

        />

            property="og:description"
            content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!"
        />
        <title>Automate Your Trades | CharlesTraders</title>
        <style>
            :root {
                font-size: 62.5%;
            }
        </style>
        <style>
            /* No overflow: hidden here - it would block the phone's pull-to-refresh while the splash shows. */
            html.mw-boot,
            html.mw-boot body {
                background: #0e0e0e !important;
            }
            html.mw-boot #root,
            html.mw-boot #modal_root,
            html.mw-boot #popup_root {
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }

            #mw-boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483646;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.6rem;
                background: #0e0e0e;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }

            /* Market illustration, animated only by transforms and opacity: those run off the
               main thread, so it stays smooth while the app's code starts and costs that
               start-up nothing (animating strokes would repaint every frame). The left half
               shows from the start; two covers slide off the right half: one in steps, a
               candle at a time, and one smoothly for the line. Each hides what lies under it,
               hence candles < stepped cover < line < cover, with the grid above both. The
               app waits for this draw to end (src/utils/boot-splash.ts), so keep it short. */
            #mw-boot-splash .chart {
                position: absolute;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }
            #mw-boot-splash .chart svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                fill: none;
            }
            /* The drawing stretches to the screen, so a phone sees the whole sweep. Thin
               strokes keep their width; candle bodies narrow with it. */
            #mw-boot-splash .chart path:not(.b) {
                vector-effect: non-scaling-stroke;
            }
            #mw-boot-splash .chart .cover {
                position: absolute;
                inset: 0;
                background: #0e0e0e;
                animation: mw-boot-draw 1.8s linear both;
            }
            #mw-boot-splash .chart .cover::before {
                content: '';
                position: absolute;
                top: 0;
                bottom: 0;
                right: 100%;
                width: 1.2rem;
                background: linear-gradient(90deg, transparent, #0e0e0e);
            }
            /* 20 steps of 30 drawing units: one candle each. The soft edge, one step wide,
               brings each candle in over two steps rather than at once. */
            #mw-boot-splash .chart .cover.step {
                animation-timing-function: steps(20, end);
            }
            #mw-boot-splash .chart .cover.step::before {
                width: 2.5%;
            }
            /* The latest price. As wide and tall as the chart, so a percentage translate is
               a position on the drawing at any screen size. Rides the line because its
               keyframes are the line's own points, at the times the cover passes them. */
            #mw-boot-splash .chart .pt {
                position: absolute;
                inset: 0;
                transform: translate(93.75%, 23.88%);
                animation: mw-boot-pt 1.8s linear both;
            }
            #mw-boot-splash .chart .pt::before,
            #mw-boot-splash .chart .pt::after {
                content: '';
                position: absolute;
                top: -0.4rem;
                left: -0.4rem;
                width: 0.8rem;
                height: 0.8rem;
                border-radius: 50%;
            }
            #mw-boot-splash .chart .pt::before {
                background: #a9cbe6;
                box-shadow: 0 0 1rem 0.2rem #5b86adb3;
            }
            #mw-boot-splash .chart .pt::after {
                background: #5b86ad;
                opacity: 0;
                /* Starts as the dot reaches the last price. */
                animation: mw-boot-pulse 1.2s ease-out 1.57s infinite;
            }
            #mw-boot-splash .chart .fade {
                position: absolute;
                inset: 0;
                background: radial-gradient(ellipse 34% 24% at center, #0e0e0ecc 35%, transparent);
            }
            #mw-boot-splash .wm,
            #mw-boot-splash .tag,
            #mw-boot-splash .bar {
                position: relative;
            }

            #mw-boot-splash .wm {
                font-size: 3.2rem;
                font-weight: 900;
                letter-spacing: -1px;
                line-height: 1;
                white-space: nowrap;
            }
            #mw-boot-splash .wm-charles {
                color: #22c55e;
                text-shadow: 0 0 20px #22c55e80;
            }
            #mw-boot-splash .wm-traders {
                color: #ef4444;
                text-shadow: 0 0 20px #ef444480;
            }

            #mw-boot-splash .tag {
                font-size: 1.2rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #94a3b8;
            }

            #mw-boot-splash .bar {
                width: 16rem;
                height: 3px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.08);
                overflow: hidden;
            }
            #mw-boot-splash .bar::after {
                content: '';
                display: block;
                width: 40%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #22c55e, #22d3ee);
                animation: mw-boot-progress 1.2s ease-in-out infinite;
            }

            @keyframes mw-boot-progress {
                0% {
                    transform: translateX(-120%);
                }
                100% {
                    transform: translateX(320%);
                }
            }
            @keyframes mw-boot-draw {
                from {
                    transform: translateX(50%);
                }
                to {
                    transform: translateX(100%);
                }
            }
            @keyframes mw-boot-pulse {
                from {
                    opacity: 0.6;
                    transform: scale(1);
                }
                to {
                    opacity: 0;
                    transform: scale(3.6);
                }
            }
            @keyframes mw-boot-pt {
                0% {
                    transform: translate(50%, 18.81%);
                }
                2.5% {
                    transform: translate(51.25%, 19.5%);
                }
                7.5% {
                    transform: translate(53.75%, 26.5%);
                }
                12.5% {
                    transform: translate(56.25%, 30.75%);
                }
                17.5% {
                    transform: translate(58.75%, 30.75%);
                }
                22.5% {
                    transform: translate(61.25%, 25.38%);
                }
                27.5% {
                    transform: translate(63.75%, 15.75%);
                }
                32.5% {
                    transform: translate(66.25%, 18.38%);
                }
                37.5% {
                    transform: translate(68.75%, 21.75%);
                }
                42.5% {
                    transform: translate(71.25%, 29%);
                }
                47.5% {
                    transform: translate(73.75%, 33.88%);
                }
                52.5% {
                    transform: translate(76.25%, 36.13%);
                }
                57.5% {
                    transform: translate(78.75%, 41.63%);
                }
                62.5% {
                    transform: translate(81.25%, 59%);
                }
                67.5% {
                    transform: translate(83.75%, 74%);
                }
                72.5% {
                    transform: translate(86.25%, 87.75%);
                }
                77.5% {
                    transform: translate(88.75%, 83.38%);
                }
                82.5% {
                    transform: translate(91.25%, 52.25%);
                }
                87.5% {
                    transform: translate(93.75%, 23.88%);
                }
                100% {
                    transform: translate(93.75%, 23.88%);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #mw-boot-splash .chart .cover,
                #mw-boot-splash .chart .pt::after {
                    display: none;
                }
                #mw-boot-splash .chart .pt {
                    animation: none;
                }
                #mw-boot-splash .bar::after {
                    animation: none;
                    width: 100%;
                }
            }
        </style>
        <script>
            document.documentElement.classList.add('mw-boot');
            setTimeout(function () {
                document.documentElement.classList.remove('mw-boot');
                var s = document.getElementById('mw-boot-splash');
                if (s) s.remove();
            }, 8000);
        </script>
    </head>

    <body class="body theme theme--dark">
        <!-- Companion to the <head> script: .theme--light/.theme--dark (see _themes.scss)
             are scoped to a descendant of <html>, so they have to be set here, not in <head>
             where <body> doesn't exist yet. Still the very first thing in <body>, before the
             splash markup below it, so this runs before anything paints. The splash itself
             (#mw-boot-splash) is styled with its own hardcoded colors, not these classes -
             it stays dark regardless of theme, on purpose. -->
        <script>
            (function () {
                try {
                    var isLight = localStorage.getItem('ct-theme') === 'light';
                    document.body.classList.toggle('theme--light', isLight);
                    document.body.classList.toggle('theme--dark', !isLight);
                } catch (e) {
                    /* localStorage unavailable - keep the authored dark default */
                }
            })();
        </script>
